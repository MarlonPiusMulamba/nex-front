<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#daa520" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NexFi">
  <link id="manifest-link" rel="manifest" href="/manifest.json">
  <link id="app-favicon" rel="icon" type="image/png" href="/logo.png">
  <link id="app-apple-touch-icon" rel="apple-touch-icon" href="/logo.png">

  <!-- Primary Meta Tags -->
  <title>NexFi - Connect, Share & Communicate</title>
  <meta name="title" id="meta-title" content="NexFi - Connect, Share & Communicate" />
  <meta name="description" id="meta-desc" content="Connect, share updates, direct message, and communicate seamlessly on NexFi." />
  <meta name="application-name" content="NexFi" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / Facebook / WhatsApp Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:title" id="og-title" content="NexFi - Connect, Share & Communicate" />
  <meta property="og:description" id="og-desc" content="Connect, share updates, direct message, and communicate seamlessly on NexFi." />
  <meta property="og:image" id="og-image" content="/logo.png" />
  <meta property="og:site_name" content="NexFi" />

  <!-- Twitter Card -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" id="twitter-title" content="NexFi - Connect, Share & Communicate" />
  <meta property="twitter:description" id="twitter-desc" content="Connect, share updates, direct message, and communicate seamlessly on NexFi." />
  <meta property="twitter:image" id="twitter-image" content="/logo.png" />
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
