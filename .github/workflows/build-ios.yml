name: Build iOS IPA (NexFi + Bugema)

# Triggers: manual run OR push to main/master
on:
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Which app to build?'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - nexfi
          - bugema
  push:
    branches: [main, master]
    paths:
      - 'xclone-mobile-js/src/**'
      - 'xclone-mobile-js/public/**'
      - 'xclone-mobile-js/capacitor.config.json'
      - 'xclone-mobile-js/package.json'

defaults:
  run:
    working-directory: xclone-mobile-js

jobs:
  # ══════════════════════════════════════════════════════════════
  # JOB 1: Build NexFi IPA
  # ══════════════════════════════════════════════════════════════
  build-nexfi-ipa:
    name: 🚀 Build NexFi IPA
    runs-on: macos-latest
    if: ${{ github.event.inputs.build_target == 'nexfi' || github.event.inputs.build_target == 'both' || github.event_name == 'push' }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xclone-mobile-js/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build NexFi web assets
        env:
          VITE_API_URL: https://ssp.bugemauniv.ac.ug
          VITE_APP_TITLE: NexFi - Campus Platform
          VITE_APP_NAME: NexFi
          VITE_ENABLE_SOCKETIO: 'true'
          NODE_ENV: production
        run: npm run build

      - name: 📱 Add Capacitor iOS platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: 🔄 Sync assets to iOS
        run: npx cap sync ios

      - name: 🍎 Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode.app
        working-directory: .

      - name: 💎 Install xcpretty
        run: gem install xcpretty --no-document
        working-directory: .

      - name: 🔧 Set app name to NexFi in Info.plist
        run: |
          INFO_PLIST="ios/App/App/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleName NexFi" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string NexFi" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName NexFi" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string NexFi" "$INFO_PLIST"
            echo "✅ Info.plist updated for NexFi"
          fi

      - name: 🔨 Archive + Package NexFi IPA (unsigned)
        run: |
          cd ios/App
          mkdir -p build

          # Archive (unsigned — no signing identity needed)
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/NexFi.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=org.xclone.nexfi \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=1 \
            archive 2>&1 | xcpretty

          echo "=== Archive contents ==="
          ls -la build/NexFi.xcarchive/Products/Applications/ || true

          # Package .app → .ipa (just a ZIP with Payload folder)
          mkdir -p build/Payload
          cp -r build/NexFi.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r NexFi_Campus.ipa Payload/
          echo "✅ NexFi_Campus.ipa created:"
          ls -lh NexFi_Campus.ipa

      - name: 📤 Upload NexFi IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexFi_Campus_IPA
          path: xclone-mobile-js/ios/App/build/NexFi_Campus.ipa
          if-no-files-found: error
          retention-days: 30

  # ══════════════════════════════════════════════════════════════
  # JOB 2: Build Bugema Notice Board IPA
  # ══════════════════════════════════════════════════════════════
  build-bugema-ipa:
    name: 🎓 Build Bugema Notice Board IPA
    runs-on: macos-latest
    if: ${{ github.event.inputs.build_target == 'bugema' || github.event.inputs.build_target == 'both' || github.event_name == 'push' }}

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: xclone-mobile-js/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build Bugema web assets (standalone mode)
        env:
          VITE_STANDALONE_ORG: bugema
          VITE_API_URL: https://ssp.bugemauniv.ac.ug
          VITE_APP_TITLE: Bugema Notice Board
          VITE_APP_NAME: Bugema Notices
          VITE_ENABLE_SOCKETIO: 'true'
          NODE_ENV: production
        run: npm run build

      - name: 📱 Add Capacitor iOS platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: 🔄 Sync assets to iOS
        run: npx cap sync ios

      - name: 🍎 Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode.app
        working-directory: .

      - name: 💎 Install xcpretty
        run: gem install xcpretty --no-document
        working-directory: .

      - name: 🔧 Set app name to Bugema Notices in Info.plist
        run: |
          INFO_PLIST="ios/App/App/Info.plist"
          if [ -f "$INFO_PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Set :CFBundleName 'Bugema Notices'" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string 'Bugema Notices'" "$INFO_PLIST"
            /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName 'Bugema Notices'" "$INFO_PLIST" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string 'Bugema Notices'" "$INFO_PLIST"
            echo "✅ Info.plist updated for Bugema Notices"
          fi

      - name: 🔨 Archive + Package Bugema IPA (unsigned)
        run: |
          cd ios/App
          mkdir -p build

          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath build/Bugema.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            PRODUCT_BUNDLE_IDENTIFIER=org.xclone.bugema \
            MARKETING_VERSION=1.0 \
            CURRENT_PROJECT_VERSION=1 \
            archive 2>&1 | xcpretty

          echo "=== Archive contents ==="
          ls -la build/Bugema.xcarchive/Products/Applications/ || true

          # Package .app → .ipa
          mkdir -p build/Payload
          cp -r build/Bugema.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r Bugema_Notice_Board.ipa Payload/
          echo "✅ Bugema_Notice_Board.ipa created:"
          ls -lh Bugema_Notice_Board.ipa

      - name: 📤 Upload Bugema IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bugema_Notice_Board_IPA
          path: xclone-mobile-js/ios/App/build/Bugema_Notice_Board.ipa
          if-no-files-found: error
          retention-days: 30
